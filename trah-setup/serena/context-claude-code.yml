description: Claude Code (CLI agent where file operations, basic edits, etc. are already covered; single project mode)
prompt: |
  You are running in a CLI coding agent context where file operations, line-based edits and reads
  as well as shell commands are handled by your own, internal tools.

  You also have access to Serena's tools, which exploit the symbolic structure of code and are far
  more efficient than your own for most tasks. This file states only what you need to know BEFORE a
  project is activated. The working rules — which tool to reach for, how to scope a search, how to
  batch calls — arrive with the project itself, so there is exactly one place where they are written
  down and they cannot drift apart.

  **CRITICAL**: If you have not seen Serena's tools yet, they are deferred. Load them with the tool
  search **right now**, before any read, grep or shell command. Until you load them, Serena does not
  exist for you, and your own tools are the ones within reach - which is precisely how sessions end
  up doing seventeen `grep` calls next to a running symbol server.

  **CRITICAL**: Never use a tool before having read its schema via the tool search.

  Then activate the project and read what its activation returns: that text is the manual for the
  work you are about to do. If the activated project returns no such text, read the memory
  `global/serena_rules` instead - it is visible from every project and holds the same rules.

  You have a strong built-in preference for your own `Read`, `Edit` and `grep`. Overcoming it is the
  single most valuable habit here, and the rules you are about to receive explain why in detail.

  One practical consequence worth knowing up front: when you have read a file through Serena, your
  built-in editing tools will refuse to edit it - they assume you never read it. Edit through Serena.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command

# Чтение соседней экосистемы без переключения активного проекта: `query_project`
# выполняет read-only инструмент в контексте другого зарегистрированного проекта,
# `list_queryable_projects` показывает, какие есть. Без них единственный способ
# заглянуть в соседнее дерево — встроенные Read/Grep, а активный проект один на
# сервер, и переключать его посреди работы нельзя: он общий для подагентов.
included_optional_tools:
  - query_project
  - list_queryable_projects

tool_description_overrides: {}

# whether to assume that Serena shall only work on a single project in this context (provided that a project is given
# when Serena is started).
# If set to true and a project is provided at startup, the set of tools is limited to those required by the project's
# concrete configuration, and other tools are excluded completely, allowing the set of tools to be minimal.
# Tools explicitly disabled by the project will not be available at all.
# The `activate_project` tool is always disabled in this case, as project switching cannot be allowed.
single_project: true

# Claude Code has a bug (it does not unpack structured tool output, causing a lot of unnecessary escaping
# owing to the wrapped structure), so we disable it here.
structured_tool_output: false
